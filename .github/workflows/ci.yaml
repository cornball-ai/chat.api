name: ci

on:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  ci:
    strategy:
      matrix:
        include:
          - {os: macos-latest}
          - {os: ubuntu-latest}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      - name: Dependencies
        run: ./run.sh install_deps

      # test_matrix_mxclient.R exit_file()s without mx.client, and that
      # file holds the direct tests for the crypto boundary functions --
      # the encryption-state lookup and the encrypted send, both of which
      # leak if they fail open. They sit behind chat_matrix()'s .crypto
      # seam, so nothing in test_matrix.R can reach them. install_deps
      # takes hard dependencies only, so without this they skip
      # themselves into a green check.
      #
      # curl and jsonlite come first and explicitly: chat.api has no
      # dependencies of its own, so install_deps brings in nothing, and
      # mx.api needs both.
      - name: Install Matrix stack
        run: |
          Rscript -e 'install.packages(c("curl", "jsonlite"))'
          for pkg in mx.api mx.client; do
            git clone --depth 1 "https://github.com/cornball-ai/$pkg.git" "$RUNNER_TEMP/$pkg"
            R CMD INSTALL "$RUNNER_TEMP/$pkg"
          done

      # mx.crypto needs a Rust toolchain to build from source, so it is
      # Linux-only here, off the r2u binary rapt already has sources for.
      # Its one test -- that matrix_crypto_init() binds the store before
      # opening the account -- is conditional and does not run on macOS.
      - name: Install mx.crypto (Linux)
        if: runner.os == 'Linux'
        run: Rscript -e 'install.packages("mx.crypto")'

      # Fail loudly rather than letting the suite skip. mx.crypto is
      # reported but not required, since the macOS leg does without it.
      #
      # The mx.client floor is enforced, not just declared: the adapter
      # calls straight into mx_send_encrypted() and cannot work around
      # what an older one gets wrong. Every step of reading that floor is
      # checked, because a parse that quietly finds nothing would wave
      # through exactly what this is here to catch -- which is what the
      # first version of corteza's equivalent did on macOS.
      - name: Verify Matrix stack
        run: |
          Rscript -e '
            for (p in c("mx.api", "mx.client")) {
              if (!requireNamespace(p, quietly = TRUE))
                stop("chat.api CI needs ", p, ": without it ",
                     "test_matrix_mxclient.R skips itself", call. = FALSE)
            }
            sug <- read.dcf("DESCRIPTION")[1L, "Suggests"]
            if (is.na(sug)) stop("no Suggests field in DESCRIPTION")
            e <- grep("^mx[.]client",
                      trimws(strsplit(sug, ",")[[1L]]), value = TRUE)
            if (!length(e)) stop("no mx.client entry in Suggests")
            m <- regmatches(e, regexpr("[0-9][0-9.-]*", e))
            if (!length(m)) stop("mx.client Suggests entry declares no floor")
            floor <- package_version(m)
            have <- utils::packageVersion("mx.client")
            message("mx.client ", have, " (>= ", floor, ")")
            if (have < floor)
              stop("mx.client ", have, " is below the ", floor,
                   " chat.api declares", call. = FALSE)
            message("mx.api ", utils::packageVersion("mx.api"))
            message("mx.crypto ",
                    if (requireNamespace("mx.crypto", quietly = TRUE))
                      as.character(utils::packageVersion("mx.crypto"))
                    else "absent (crypto-init test will not run)")'

      - name: Test
        run: ./run.sh run_tests
