name: ci

on:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "true"

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest}
          - {os: ubuntu-latest}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      # Matrix from source so binary rebuilds cannot select older
      # versions. The drat comes first: the call surface needs mx.client
      # 0.2.1.1 (and its mx.api 0.3.1.1), which are released there and
      # not yet on CRAN. available.packages() keeps the first repository
      # that lists a package, so the drat's build wins while it is newer;
      # once CRAN carries these versions the drat entry can go. Include
      # all adapter test packages from CRAN as well.
      - name: Install CRAN dependencies
        run: |
          Rscript -e '
            if (isTRUE(getOption("rapt.enabled"))) rapt::disable()
            remotes::install_cran(c("mx.api", "mx.crypto", "mx.client"),
                                  repos = c("https://cornball-ai.github.io/drat",
                                            "https://cran.r-project.org"),
                                  type = "source", upgrade = "never")
            remotes::install_deps(".", dependencies = TRUE,
                                  repos = "https://cran.r-project.org",
                                  upgrade = "never")'

      # A missing optional package would silently skip its adapter tests.
      # Check every Suggests entry, including both Matrix version floors.
      - name: Verify adapter dependencies
        run: |
          Rscript -e '
            suggests <- read.dcf("DESCRIPTION")[1L, "Suggests"]
            if (is.na(suggests) || !nzchar(suggests))
              stop("No Suggests field in DESCRIPTION")
            entries <- trimws(strsplit(suggests, ",", fixed = TRUE)[[1L]])
            for (entry in entries) {
              parts <- regmatches(entry, regexec(
                "^([[:alnum:].]+)( [(]>= ([0-9.]+)[)])?$", entry))[[1L]]
              if (!length(parts)) stop("Unsupported Suggests entry: ", entry)
              pkg <- parts[[2L]]
              if (!requireNamespace(pkg, quietly = TRUE))
                stop("Adapter tests require ", pkg)
              have <- utils::packageVersion(pkg)
              floor <- parts[[4L]]
              if (nzchar(floor) && have < package_version(floor))
                stop(pkg, " ", have, " is below the required ", floor)
              message(pkg, " ", have, " at ", find.package(pkg))
            }'

      - name: Test
        run: ./run.sh run_tests

      - name: Fail on check warnings
        run: |
          log=chat.api.Rcheck/00check.log
          if [ ! -f "$log" ]; then
            echo "Missing $log: R CMD check did not finish" >&2
            exit 1
          fi
          grep -E '^Status:' "$log"
          if grep -qE '^Status:.*(ERROR|WARNING)' "$log"; then
            cat "$log" >&2
            exit 1
          fi
